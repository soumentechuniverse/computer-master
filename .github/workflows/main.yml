name: Build Computer Master APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: computer-master-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build APK
        run: gradle assembleDebug

      - name: Verify APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Computer-Master-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          TAG="v1.3.2"
          NOTES="Computer Master 1.3.2

          - Uses the permanent signing key for compatible in-place updates.
          - In-app update metadata points to this release.
          - Existing installations should be updated without uninstalling when their signing certificate matches."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --title "Computer Master 1.3.2" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_PATH" --title "Computer Master 1.3.2" --notes "$NOTES"
          fi
