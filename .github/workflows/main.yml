name: Build Computer Master APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore

      - name: Print SHA-1 fingerprint
        run: |
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Computer-Master-APK
          path: '**/build/outputs/apk/**/*.apk'

      - name: Publish update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          TAG="v1.3.1"
          NOTES="Computer Master 1.3.1\n\n- Expanded and checked 20 computer learning courses.\n- Improved lesson details and visual learning diagrams.\n- Includes in-app update metadata and update notification support."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
            gh release edit "$TAG" --title "Computer Master 1.3.1" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_PATH" --title "Computer Master 1.3.1" --notes "$NOTES"
          fi
